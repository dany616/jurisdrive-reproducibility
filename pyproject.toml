[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jurisdrive"
version = "1.0.0"
description = "Provenance-bounded legal-judgment to driving-scenario research pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=12,<13",
  "pydantic>=2.13,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
paper = [
  "matplotlib>=3.11,<4",
  "numpy>=2.5,<3",
]

[project.scripts]
jurisdrive = "jurisdrive.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jurisdrive*"]
